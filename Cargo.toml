[package]
name = "openrouter-chat"
version = "0.1.0"
edition = "2021"
description = "OpenRouter AI chat client for the reMarkable Paper Pro (AppLoad/QTFB app)"
autobins = false

[lib]
name = "openrouter_chat"
path = "src/lib.rs"

[[bin]]
name = "openrouter-chat"
path = "src/main.rs"

[dependencies]
# Pure-Rust HTML/CSS rendering stack retained for all workspace and Markdown UI.
blitz-dom = "0.2"
blitz-html = "0.2"
blitz-paint = "0.2"
blitz-traits = "0.2"
parley = "0.6"
anyrender = "0.6"
anyrender_vello_cpu = "0.7"

# OpenRouter transport and payload support; rustls + bundled WebPKI roots keeps
# HTTPS working in the static musl binary with no system CA bundle on device.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
serde_json = "1"
pulldown-cmark = "0.13"
base64 = "0.22"
png = "0.17"
anyhow = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "unwind"
