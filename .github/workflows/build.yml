name: Build OpenRouter Chat

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build AppLoad bundle
        run: ./tools/build-appload.sh

      - name: Check bundle
        run: |
          echo "=== BUNDLE ==="
          find dist -maxdepth 2 -type f -print
          file dist/openrouter-chat/openrouter-chat
          tar -tzf dist/openrouter-chat-appload.tar.gz
          cmp external.manifest.json dist/openrouter-chat/external.manifest.json

      - name: Upload application bundle
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-chat-appload
          path: dist/openrouter-chat-appload.tar.gz
          if-no-files-found: error

      - name: Attach bundle to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/openrouter-chat-appload.tar.gz
          generate_release_notes: true
