name: Build AnkiMarkable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            build-essential \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: |
          cargo install cargo-zigbuild

      - name: Build AnkiMarkable
        env:
          PROTOC: /usr/bin/protoc
        run: |
          cargo zigbuild \
            --target aarch64-unknown-linux-musl \
            --release

      - name: Check binary
        run: |
          file target/aarch64-unknown-linux-musl/release/ankimarkable
          ls -lh target/aarch64-unknown-linux-musl/release/ankimarkable

      - name: Prepare package
        run: |
          mkdir -p package

          cp target/aarch64-unknown-linux-musl/release/ankimarkable package/

          if [ -f icon.png ]; then
            cp icon.png package/
          fi

          if [ -f external.manifest.json ]; then
            cp external.manifest.json package/
          fi

          echo "=== PACKAGE ==="
          find package -maxdepth 2 -type f -print

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: ankimarkable
          path: package/
